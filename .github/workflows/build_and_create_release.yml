name: Build APK / create release

run-name: ${{ inputs.publish_signed_release && 'Create signed APK release' || 'Build unsigned APK artifact' }}

on:
  workflow_dispatch:
    inputs:
      publish_signed_release:
        description: Create the signed, published GitHub release. Uncheck only for an unsigned Actions artifact.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required signing secrets
        if: ${{ inputs.publish_signed_release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("SIGNING_KEYSTORE_BASE64")
          [[ -n "$KEY_ALIAS" ]] || missing+=("SIGNING_KEY_ALIAS")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("SIGNING_KEYSTORE_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            joined="$(IFS=', '; echo "${missing[*]}")"
            echo "::error::Cannot publish a signed release. Missing GitHub Actions secrets: $joined"
            echo "Add the SIGNING_* repository secrets, then rerun this workflow."
            echo "Only disable 'publish_signed_release' when you intentionally want an unsigned Actions artifact and no GitHub release."
            exit 1
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Validate signing keystore
        if: ${{ inputs.publish_signed_release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          chmod 600 keystore.jks

          if [[ ! -s keystore.jks ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 decoded to an empty keystore."
            exit 1
          fi

          if ! keytool -list \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The signing keystore, password, or alias is invalid."
            exit 1
          fi

      - name: Extract version and version code
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's~versionName ?= ?\"(.*)\"~\1~p' app/build.gradle.kts | tr -d ' ')"
          VERSION_CODE="$(sed -nE 's~versionCode ?= ?(.*)~\1~p' app/build.gradle.kts | tr -d ' ')"

          if [[ -z "$VERSION" || -z "$VERSION_CODE" ]]; then
            echo "::error::Could not extract versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Prepare changelog
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            cp "$CHANGELOG_FILE" __changelog_file__
            sed -Ei 's/^([a-zA-Z0-9 ]+):$/### \1/g' __changelog_file__
            sed -i 's/•/-/g' __changelog_file__
          else
            echo "Did not find changelog file: $CHANGELOG_FILE"
            : > __changelog_file__
          fi

      - name: Locate apksigner
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::Could not find an executable apksigner at $APKSIGNER"
            exit 1
          fi
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Print build information
        env:
          VERSION: ${{ env.VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          APKSIGNER: ${{ env.APKSIGNER }}
          PUBLISH_SIGNED_RELEASE: ${{ inputs.publish_signed_release }}
        shell: bash
        run: |
          {
            echo "Version: $VERSION"
            echo "Version code: $VERSION_CODE"
            echo "Android home: $ANDROID_HOME"
            echo "Chosen apksigner: $APKSIGNER"
            echo "Publish signed release: $PUBLISH_SIGNED_RELEASE"
            echo
            echo "Changelog:"
            cat __changelog_file__
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK artifact
        env:
          VERSION: ${{ env.VERSION }}
          PUBLISH_SIGNED_RELEASE: ${{ inputs.publish_signed_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apks
          if [[ "$PUBLISH_SIGNED_RELEASE" == "true" ]]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk "apks/Dicio_${VERSION}.apk"
          else
            mv app/build/outputs/apk/release/app-release-unsigned.apk "apks/Dicio_${VERSION}-unsigned.apk"
          fi

      - name: Sign and verify APK
        if: ${{ inputs.publish_signed_release }}
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          VERSION: ${{ env.VERSION }}
          APKSIGNER: ${{ env.APKSIGNER }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f keystore.jks' EXIT
          APK="apks/Dicio_${VERSION}.apk"

          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Record APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum apks/*.apk | tee apk-sha256.txt
          {
            echo
            echo "APK SHA-256:"
            echo '```'
            cat apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ env.VERSION }}
          path: |
            apks/*.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Refuse to overwrite a published release
        if: ${{ inputs.publish_signed_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Release v${VERSION} already exists and is published; refusing to overwrite it."
              exit 1
            fi
          fi

      - name: Create or publish release
        if: ${{ inputs.publish_signed_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: __changelog_file__
          draft: false
          files: |
            apks/Dicio_${{ env.VERSION }}.apk
            apk-sha256.txt
